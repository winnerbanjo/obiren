      parameters:
        - name: id
          required: true
          in: path
          description: 24-character SOS incident identifier.
          schema:
            type: string
      responses:
        '200':
          description: Recorded delivery attempts and dispatch status.
        '404':
          description: Incident not found for this account.
      security:
        - accessToken: []
      summary: List recorded SOS delivery attempts
      tags:
        - Safety
  /safety/incidents:
    get:
      description: Returns up to 100 incidents belonging to the authenticated user, newest first.
      operationId: SafetyController_getIncidents
      parameters: []
      responses:
        '200':
          description: The user’s recent safety incidents.
      security:
        - accessToken: []
      summary: List recent SOS incidents
      tags:
        - Safety
  /health-vault/upload-intent:
    post:
      description: >-
        Returns Cloudinary upload parameters; the mobile client uploads the file directly to uploadUrl using the
        returned apiKey, signature, timestamp, folder, and publicId. The API secret is never exposed. Requires
        configured storage credentials.
      operationId: HealthVaultController_generateUploadIntent
      parameters: []
      responses:
        '201':
          description: Short-lived upload signature and exact signed parameters.
        '503':
          description: Document storage is not configured.
      security:
        - accessToken: []
      summary: Create a signed document-upload intent
      tags:
        - Health vault
  /health-vault/documents:
    get:
      description: Returns the authenticated user’s non-deleted document metadata, newest first.
      operationId: HealthVaultController_getDocuments
      parameters: []
      responses:
        '200':
          description: Health-vault document list.
      security:
        - accessToken: []
      summary: List health-vault documents
      tags:
        - Health vault
    post:
      description: >-
        Call after uploading a file with a successful upload intent. Submit the Cloudinary public ID returned/generated
        for that upload; this endpoint stores metadata and does not upload the file itself.
      operationId: HealthVaultController_saveDocument
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - title
                - cloudinaryPublicId
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                  example: October blood test
                documentType:
                  type: string
                  enum:
                    - laboratory_result
                    - prescription
                    - ultrasound
                    - scan
                    - referral
                    - vaccination
                    - medical_note
                    - other
                  default: medical_note
                cloudinaryPublicId:
                  type: string
                  minLength: 1
                  maxLength: 300
                accessLevel:
                  type: string
                  enum:
                    - private
                    - shared_with_trusted_circle
                    - shared_with_professional
                  default: private
                dateOfRecord:
                  type: string
                  format: date
                healthcareProviderName:
                  type: string
                  maxLength: 160
                tags:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    maxLength: 40
                  default: []
      responses:
        '201':
          description: Document metadata saved.
      security:
        - accessToken: []
      summary: Save uploaded document metadata
      tags:
        - Health vault
  /health-vault/documents/{id}:
    get:
      description: >-
        Returns an owner-only signed URL that expires after five minutes. Do not persist or share the URL; request a new
        one when needed.
      operationId: HealthVaultController_getSignedDownloadUrl
      parameters:
        - name: id
          required: true
          in: path
          description: 24-character document identifier.
          schema:
            example: 66a0b6f3e5f21c8e7a112233
            type: string
      responses:
        '200':
          description: Short-lived signed download URL.
        '403':
          description: Document belongs to another user.
        '404':
          description: Document does not exist.
        '503':
          description: Document storage is not configured.
      security:
        - accessToken: []
      summary: Create a signed document-download URL
      tags:
        - Health vault
    delete:
      description: Soft-deletes the authenticated user’s document metadata. A deleted document can no longer be downloaded.
      operationId: HealthVaultController_deleteDocument
      parameters:
        - name: id
          required: true
          in: path
          description: 24-character document identifier.
          schema:
            example: 66a0b6f3e5f21c8e7a112233
            type: string
      responses:
        '200':
          description: Document marked deleted.
        '403':
          description: Document belongs to another user.
        '404':
          description: Document does not exist.
      security:
        - accessToken: []
      summary: Delete a health-vault document
      tags:
        - Health vault
  /admin/metrics:
    get:
      description: >-
        Returns aggregate user, pregnancy, emergency-resource, and country metrics. Requires a super_admin or
        platform_admin role.
      operationId: AdminController_getMetrics
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - accessToken: []
      summary: Get administrative platform metrics
      tags:
        - Admin
  /admin/users:
    get:
      description: Returns a paginated account listing. Requires a super_admin or platform_admin role.
      operationId: AdminController_listUsers
      parameters:
        - name: page
          required: true
          in: query
          schema:
            type: string
        - name: limit
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - accessToken: []
      summary: List user accounts (admin)
      tags:
        - Admin
  /admin/users/{id}/status:
    put:
      description: >-
        Changes a user’s account status. Requires super_admin or platform_admin; only a super_admin may modify another
        super_admin account.
      operationId: AdminController_setUserStatus
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - accessToken: []
      summary: Change an account status (admin)
      tags:
        - Admin
  /admin/directory:
    put:
      description: Upserts a health-directory record. Requires super_admin, platform_admin, or emergency_manager role.
      operationId: AdminController_upsertDirectory
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - accessToken: []
      summary: Create or update a directory record (admin)
      tags:
        - Admin
  /admin/clinicians:
    get:
      description: >-
        Returns clinician verification state, evidence references, and review metadata. Requires super_admin or
        platform_admin.
      operationId: AdminController_listClinicians
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - accessToken: []
      summary: List clinician verification records (admin)
      tags:
        - Admin
  /admin/clinicians/{id}/verification:
    put:
      description: >-
        Records an audited verification decision. Verifying requires a stored evidence reference and a linked account
        holding the clinician role. Only verified, active clinicians appear in the user catalog.
      operationId: AdminController_verifyClinician
      parameters:
        - name: id
          required: true
          in: path
          description: 24-character clinician profile identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - verificationStatus
              additionalProperties: false
              properties:
                verificationStatus:
                  type: string
                  enum:
                    - pending
                    - verified
                    - rejected
                evidenceRef:
                  type: string
                  maxLength: 300
                  description: Reference to stored verification evidence; required to verify.
                note:
                  type: string
                  maxLength: 500
                active:
                  type: boolean
                  description: Defaults to true when verified, false otherwise.
      responses:
        '200':
          description: Verification decision recorded and audited.
        '400':
          description: Missing evidence reference.
        '404':
          description: Clinician profile not found.
        '422':
          description: Linked account is missing or lacks the clinician role.
      security:
        - accessToken: []
      summary: Review a clinician verification (admin)
      tags:
        - Admin
  /admin/consultations:
    post:
      description: >-
        Creates a membership-scoped care relationship between an active patient and a verified, active clinician. This
        is not a booking, payment, or confirmed appointment.
      operationId: AdminController_createConsultation
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patientUserId
                - clinicianId
              additionalProperties: false
              properties:
                patientUserId:
                  type: string
                  pattern: ^[0-9a-fA-F]{24}$
                clinicianId:
                  type: string
                  pattern: ^[0-9a-fA-F]{24}$
      responses:
        '201':
          description: Consultation recorded; booking and payment are not confirmed.
        '404':
          description: Patient account or verified clinician not found.
        '409':
          description: An open consultation already exists.
      security:
        - accessToken: []
      summary: Record a patient–clinician consultation (admin)
      tags:
        - Admin
  /admin/audit-logs:
    get:
      description: Returns the latest audit records. Requires super_admin or compliance_officer role.
      operationId: AdminController_getAuditLogs
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - accessToken: []
      summary: List audit logs (admin)
      tags:
        - Admin
  /waitlist:
    post:
      description: >-
        Public, rate-limited signup (10 requests per minute per IP). Duplicate emails receive the same response shape as
        new signups to prevent account enumeration.
      operationId: WaitlistController_join
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 320
                  example: maya@example.com
                firstName:
                  type: string
                  maxLength: 80
                source:
                  type: string
                  maxLength: 60
                  default: web
                market:
                  type: string
                  maxLength: 60
                referral:
                  type: string
                  maxLength: 120
      responses:
        '201':
          description: Signup accepted; response indicates whether the email was already on the list.
        '429':
          description: Rate limit exceeded.
      summary: Join the early-access waitlist
      tags:
        - Waitlist
    get:
      description: Returns aggregate signup count only; no personal information is exposed.
      operationId: WaitlistController_stats
      parameters: []
      responses:
        '200':
          description: Aggregate waitlist count.
      summary: Get public waitlist totals
      tags:
        - Waitlist
  /waitlist/entries:
    get:
      description: >-
        Privileged operational endpoint for paginated waitlist entries. Requires a bearer token with super_admin or
        platform_admin role; not intended for mobile clients.
      operationId: WaitlistController_list
      parameters:
        - name: page
          required: false
          in: query
          description: 1-based page number (default 1).
          schema:
            example: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Page size (default 50; maximum 200).
          schema:
            example: 50
            type: number
      responses:
        '200':
          description: Paginated waitlist entries.
        '403':
          description: Administrative role required.
      security:
        - accessToken: []
      summary: List waitlist entries (admin)
      tags:
        - Waitlist
  /waitlist/preview:
    get:
      description: >-
        Development preview returning HTML by default or JSON with format=json. In production requires the private
        X-List-Key header. Use the role-protected /waitlist/entries API for normal admin access; this route is not for
        mobile clients.
      operationId: WaitlistController_preview
      parameters:
        - name: format
          required: false
          in: query
          description: Return JSON instead of the default HTML preview.
          schema:
            enum:
              - json
            type: string
        - name: X-List-Key
          in: header
          description: Required in production; value is configured by the operator.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Waitlist preview in requested format.
        '404':
          description: Preview is not available to this caller.
      summary: Waitlist preview (operator-only)
      tags:
        - Waitlist
  /health:
    get:
      description: >-
        Lightweight liveness probe. A successful response confirms the HTTP service is running; it does not guarantee
        downstream dependencies are healthy.
      operationId: HealthController_health
      parameters: []
      responses:
        '200':
          description: Service liveness and server timestamp.
          content:
            application/json:
              example:
                success: true
                data:
                  status: ok
                  service: obiren-api
                  version: 1.0.0
                  timestamp: '2026-10-19T12:00:00.000Z'
      summary: Check API liveness
      tags:
        - Health
  /home:
    get:
      description: >-
        Aggregates persisted current-cycle, pregnancy, and recent-log state. Dates and predictions are estimates, not
        medical advice.
      operationId: HomeController_getHome
      parameters: []
      responses:
        '200':
          description: Persisted home summary for the bearer-token owner.
      security:
        - accessToken: []
      summary: Get authenticated-user home summary
      tags:
        - Home
  /daily-logs:
    get:
      description: >-
        Returns only the authenticated user’s logs, ordered by local calendar date. Free-text notes are omitted from
        this calendar response.
      operationId: HomeController_getCalendar
      parameters:
        - name: to
          required: true
          in: query
          description: Inclusive local calendar date (YYYY-MM-DD); range maximum 93 days.
          schema: {}
        - name: from
          required: true
          in: query
          description: Inclusive local calendar date (YYYY-MM-DD).
          schema: {}
      responses:
        '200':
          description: Calendar log entries; notes are omitted.
      security:
        - accessToken: []
      summary: List daily logs for a calendar range
      tags:
        - Home
  /care/clinicians:
    get:
      description: Unverified or inactive clinicians are never exposed in the user catalog.
      operationId: CareController_listClinicians
      parameters: []
      responses:
        '200':
          description: Verified clinician catalog.
      summary: List active verified specialists
      tags:
        - Care
  /care/availability:
    get:
      description: Only slots owned by active verified clinicians are returned. Expired holds are treated as open.
      operationId: CareController_listAvailability
      parameters: []
      responses:
        '200':
          description: Verified specialist availability.
      summary: List available specialist slots
      tags:
        - Care
    post:
      description: Only a verified clinician may publish future availability. No price or booking entitlement is created.
      operationId: CareController_createAvailability
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - startsAt
                - endsAt
                - sessionType
              additionalProperties: false
              properties:
                startsAt:
                  type: string
                  format: date-time
                endsAt:
                  type: string
                  format: date-time
                sessionType:
                  type: string
                  enum:
                    - clinic
                    - audio
                    - video
                    - text
      responses:
        '201':
          description: Availability slot published.
        '403':
          description: Active verified clinician profile required.
      security:
        - accessToken: []
      summary: Publish a clinician availability slot
      tags:
        - Care
  /care/holds:
    get:
      description: Returns only non-expired holds owned by the authenticated user. Holds do not confirm appointments or payments.
      operationId: CareController_listMyHolds
      parameters: []
      responses:
        '200':
          description: Active temporary holds.
      security:
        - accessToken: []
      summary: List the caller’s active temporary holds
      tags:
        - Care
    post:
      description: Atomically holds one slot for 10 minutes. This is not a booking, payment, or confirmed appointment.
      operationId: CareController_holdSlot
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - slotId
              additionalProperties: false
              properties:
                slotId:
                  type: string
                  pattern: ^[0-9a-fA-F]{24}$
      responses:
        '201':
          description: Temporary hold created; no booking or payment confirmed.
        '409':
          description: Slot has already been held or booked.
      security:
        - accessToken: []
      summary: Create a temporary slot hold
      tags:
        - Care
  /care/holds/{id}:
    delete:
      description: Only the hold owner can release it. Confirmed booking cancellation is not implemented.
      operationId: CareController_cancelHold
      parameters:
        - name: id
          required: true
          in: path
          description: 24-character booking hold identifier.
          schema:
            type: string
      responses:
        '200':
          description: Temporary hold cancelled.
        '404':
          description: Active hold not found for this account.
      security:
        - accessToken: []
      summary: Cancel a temporary hold
      tags:
        - Care
  /consultations:
    get:
      description: >-
        Returns only consultations where the authenticated user is a participant. A consultation records a care
        relationship; it is not proof of payment or a confirmed appointment.
      operationId: CommunicationsController_listConsultations
      parameters: []
      responses:
        '200':
          description: Participant-scoped consultations and next cursor.
      security:
        - accessToken: []
      summary: List the caller’s consultations
      tags:
        - Communications
  /consultations/{id}/messages:
    get:
      description: >-
        Participant-only. Message text is decrypted per request and never stored in plaintext. Fetching marks
        counterpart messages delivered; read state requires an explicit acknowledgement.
      operationId: CommunicationsController_listMessages
      parameters:
        - name: id
          required: true
          in: path
          description: 24-character consultation identifier.
          schema:
            type: string
      responses:
        '200':
          description: Newest-first message page and next cursor.
        '404':
          description: Consultation not found for this account.
      security:
        - accessToken: []
      summary: List encrypted consultation messages
      tags:
        - Communications
    post:
      description: >-
        Participant-only. The body is encrypted before storage. This API records a message; it does not promise a
        clinician response time or emergency coverage.
      operationId: CommunicationsController_postMessage
      parameters:
        - name: id
          required: true
          in: path
          description: 24-character consultation identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
              additionalProperties: false
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 4000
                  description: Plaintext message body; encrypted with AES-256-GCM at rest.
      responses:
        '201':
          description: Message stored encrypted and returned decrypted to the sender.
        '404':
          description: Consultation not found for this account.
        '409':
          description: Consultation is closed.
        '503':
          description: Message encryption is not configured.
      security:
        - accessToken: []
      summary: Send an encrypted consultation message
      tags:
        - Communications
  /consultations/{id}/read:
    post:
      description: Participant-only, client-evidenced read acknowledgement for messages sent by the other participant.
      operationId: CommunicationsController_acknowledgeMessages
      parameters:
        - name: id
          required: true
          in: path
          description: 24-character consultation identifier.
          schema:
            type: string
      responses:
        '201':
          description: Number of messages marked read.
        '404':
          description: Consultation not found for this account.
      security:
        - accessToken: []
      summary: Acknowledge consultation messages as read
      tags:
        - Communications
  /devices:
    get:
      description: Returns only the authenticated account’s devices. Provider tokens and token hashes are never returned.
      operationId: CommunicationsController_listDevices
      parameters: []
      responses:
        '200':
          description: Owner-scoped device metadata without tokens.
      security:
        - accessToken: []
      summary: List registered notification devices
      tags:
        - Communications
    post:
      description: >-
        Stores a one-way hash of the provider token against the authenticated account. Registration does not confirm
        push delivery.
      operationId: CommunicationsController_registerDevice
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - platform
                - token
              additionalProperties: false
              properties:
                platform:
                  type: string
                  enum:
                    - ios
                    - android
                    - web
                token:
                  type: string
                  minLength: 16
                  maxLength: 4096
                  description: Provider push token; stored only as a hash.
                deviceName:
                  type: string
                  maxLength: 80
      responses:
        '201':
          description: Device registered; token is not returned.
        '409':
          description: Token already belongs to another account.
      security:
        - accessToken: []
      summary: Register a notification device
      tags:
        - Communications
  /devices/{id}:
    delete:
      description: Owner-only revocation. Future notifications must not target the revoked device.
      operationId: CommunicationsController_revokeDevice
      parameters:
        - name: id
          required: true
          in: path
          description: 24-character device identifier.
          schema:
            type: string
      responses:
        '200':
          description: Device revoked.
        '404':
          description: Active device not found for this account.
      security:
        - accessToken: []
      summary: Revoke a notification device
      tags:
        - Communications
  /notifications:
    get:
      description: Returns owner-scoped notifications. Discreet mode replaces sensitive subject/body text with neutral copy.
      operationId: CommunicationsController_inbox
      parameters: []
      responses:
        '200':
          description: Notification page and next cursor.
      security:
        - accessToken: []
      summary: List private in-app notifications
      tags:
        - Communications
  /notifications/{id}/read:
    patch:
      description: Only the notification owner can update read state.
      operationId: CommunicationsController_markRead
      parameters:
        - name: id
          required: true
          in: path
          description: 24-character notification identifier.
          schema:
            type: string
      responses:
        '200':
          description: Notification marked read.
        '404':
          description: Notification not found for this account.
      security:
        - accessToken: []
      summary: Mark a private notification as read
      tags:
        - Communications
  /notification-preferences:
    get:
      description: Returns the authenticated user’s notification channels and discreet-mode setting.
      operationId: CommunicationsController_getPreferences
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - accessToken: []
      summary: Get notification preferences
      tags:
        - Communications
    patch:
      description: >-
        Changes only the authenticated user’s preferences. Critical safety delivery remains subject to separately
        approved policy.
      operationId: CommunicationsController_updatePreferences
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                inAppEnabled:
                  type: boolean
                emailEnabled:
                  type: boolean
                smsEnabled:
                  type: boolean
                discreetMode:
                  type: boolean
                disabledCategories:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    enum:
                      - REMINDER
                      - SUPPORT
                      - SAFETY
                      - SYSTEM
      responses:
        '200':
          description: Preferences saved.
      security:
        - accessToken: []
      summary: Update notification preferences
      tags:
        - Communications
  /health-shares:
    post:
      description: >-
        Requires current health-sharing consent and an existing recipient account. The owner chooses the scopes and
        evidence range; free-text notes are never included. Only a redacted snapshot within the chosen range is shared,
        and the share expires automatically.
      operationId: CommunicationsController_createHealthShare
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - recipientUserId
                - scopes
                - from
                - to
                - expiresAt
              additionalProperties: false
              properties:
                recipientUserId:
                  type: string
                  pattern: ^[0-9a-fA-F]{24}$
                scopes:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: string
                    enum:
                      - cycles
                      - daily_logs
                      - pregnancy
                from:
                  type: string
                  format: date
                to:
                  type: string
                  format: date
                expiresAt:
                  type: string
                  format: date-time
                  description: Maximum 30 days from now.
      responses:
        '201':
          description: Share created with scope, evidence range, and expiry.
        '400':
          description: Invalid scopes, range, or expiry.
        '404':
          description: Current health-sharing consent or recipient account is missing.
      security:
        - accessToken: []
      summary: Create an expiring health-data share
      tags:
        - Communications
  /health-shares/received:
    get:
      description: >-
        Returns only shares addressed to the authenticated recipient that are neither expired nor revoked. The owner
        identity is returned as an opaque account identifier.
      operationId: CommunicationsController_getReceivedShares
      parameters: []
      responses:
        '200':
          description: Received, active shares.
      security:
        - accessToken: []
      summary: List unexpired shares received by the caller
      tags:
        - Communications
  /health-shares/{id}:
    delete:
      description: >-
        Only the sharing owner can revoke. Revocation takes effect immediately and the recipient can no longer read the
        snapshot.
      operationId: CommunicationsController_revokeHealthShare
      parameters:
        - name: id
          required: true
          in: path
          description: 24-character health-share identifier.
          schema:
            type: string
      responses:
        '200':
          description: Share revoked.
        '404':
          description: Active share not found for this owner.
      security:
        - accessToken: []
      summary: Revoke a health share
      tags:
        - Communications
info:
  title: Obiren API
  description: >-
    ## Overview

    Versioned REST API for the Obiren mobile and web clients. All routes below are relative to `/api/v1`.


    ## Mobile authentication flow

    1. Create an account with `POST /auth/register`, then verify the email address with `POST /auth/verify-email`.

    2. Sign in with `POST /auth/login` and `platform: ios` or `android`. Store the short-lived access token securely.

    3. Send protected requests with `Authorization: Bearer <accessToken>`. Access tokens expire after 15 minutes.

    4. Renew with `POST /auth/refresh` using the refresh token in the JSON body (mobile clients) or the `obiren_refresh`
    cookie (browser clients). Refresh tokens rotate; replace the stored token after each successful refresh. Lifetime:
    30 days.

    5. Revoke the session with `POST /auth/logout` when signing out.


    ## Conventions

    - Request and response bodies use JSON unless an endpoint explicitly says otherwise. Unknown request fields are
    rejected.

    - Calendar dates use `YYYY-MM-DD`; timestamps are ISO 8601.

    - Successful responses generally use `{ success, data, meta }`; `meta.requestId` can be used for support and
    troubleshooting. Some simple endpoints return a smaller success object.

    - Errors use an appropriate HTTP status. Validation errors include `message` and `statusCode`; domain errors may
    additionally include a stable `error.code`.

    - Protected operations require the access-token bearer scheme. Refresh-token cookies are `HttpOnly` and are intended
    for browser clients; native clients should send the refresh token in the request body.

    - `Admin`, `Notifications and webhooks`, and internal cron operations are operational integrations, not ordinary
    mobile-client endpoints.
