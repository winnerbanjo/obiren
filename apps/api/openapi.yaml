openapi: 3.1.0
paths:
  /auth/register:
    post:
      description: >-
        Creates a pending account and sends an email-verification link. Email is normalized to lowercase. In
        development, the verification token is included in the response; production delivers it by email.
      operationId: AuthController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
                - password
                - firstName
                - lastName
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 320
                  example: maya@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 128
                  description: Must include at least one uppercase letter and one number.
                  example: SecurePass1
                firstName:
                  type: string
                  maxLength: 80
                  example: Maya
                lastName:
                  type: string
                  maxLength: 80
                  example: Okafor
                countryCode:
                  type: string
                  enum:
                    - NG
                    - GH
                    - GB
                    - US
                  default: NG
                preferredLanguage:
                  type: string
                  minLength: 2
                  maxLength: 8
                  default: en
      responses:
        '201':
          description: Account created; email verification is pending.
          content:
            application/json:
              example:
                success: true
                data:
                  userId: 66a0b6f3e5f21c8e7a112233
                  email: maya@example.com
                  status: pending_verification
                  message: Account created. Check your email to verify your address.
                meta:
                  requestId: req_1729339200000
        '400':
          description: Invalid request or email already registered.
      summary: Create an account
      tags:
        - Authentication
  /auth/login:
    post:
      description: >-
        Returns a 15-minute bearer access token and a 30-day rotating refresh token. Native clients should set platform
        to ios or android and store refresh tokens in secure storage. Browser clients may use the HttpOnly
        obiren_refresh cookie.
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: maya@example.com
                password:
                  type: string
                  format: password
                  example: SecurePass1
                platform:
                  type: string
                  enum:
                    - web
                    - ios
                    - android
                  default: web
                  example: ios
      responses:
        '200':
          description: Authenticated. Store accessToken and refreshToken from data.tokens.
          content:
            application/json:
              example:
                success: true
                data:
                  user:
                    id: 66a0b6f3e5f21c8e7a112233
                    email: maya@example.com
                    countryCode: NG
                    roles:
                      - user
                    status: active
                    emailVerified: true
                  tokens:
                    accessToken: <jwt-access-token>
                    accessTokenExpiresIn: 15m
                    refreshToken: <opaque-refresh-token>
                    refreshTokenExpiresIn: 30d
                meta:
                  requestId: req_1729339200000
        '401':
          description: Invalid email or password.
          content:
            application/json:
              example:
                success: false
                error:
                  code: AUTH_INVALID_CREDENTIALS
                  message: The email address or password is incorrect.
        '403':
          description: Account is not permitted to sign in.
      summary: Sign in
      tags:
        - Authentication
  /auth/refresh:
    post:
      description: >-
        Exchanges a valid refresh token for a new access token and refresh token. The old refresh token is revoked
        immediately; replace it in secure storage. Native clients provide refreshToken in JSON. Browser clients may send
        the HttpOnly cookie.
      operationId: AuthController_refresh
      parameters: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  minLength: 20
                  maxLength: 256
                  description: Required for native clients; optional when the refresh cookie is present.
      responses:
        '200':
          description: >-
            Tokens rotated successfully. Persist both returned tokens; the submitted refresh token can no longer be
            reused.
          content:
            application/json:
              example:
                success: true
                data:
                  accessToken: <new-jwt-access-token>
                  refreshToken: <new-opaque-refresh-token>
                meta:
                  requestId: req_1729339200000
        '401':
          description: Refresh token is invalid, expired, revoked, or replayed.
      summary: Rotate tokens
      tags:
        - Authentication
  /auth/logout:
    post:
      description: >-
        Revokes the supplied refresh token and clears the browser refresh cookie. Native clients should pass their
        current refreshToken.
      operationId: AuthController_logout
      parameters: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                refreshToken:
                  type: string
                  minLength: 20
                  maxLength: 256
                  description: Current refresh token for a native client.
      responses:
        '200':
          description: Session revoked; safe to call again.
      summary: Sign out and revoke a refresh session
      tags:
        - Authentication
  /auth/me:
    get:
      description: >-
        Returns the account identity, roles, verification state, and a compact profile. Use this after sign-in or token
        refresh to hydrate the current-user state.
      operationId: AuthController_me
      parameters: []
      responses:
        '200':
          description: Authenticated account.
          content:
            application/json:
              example:
                success: true
                data:
                  id: 66a0b6f3e5f21c8e7a112233
                  email: maya@example.com
                  roles:
                    - user
                  status: active
                  countryCode: NG
                  emailVerified: true
                  profile:
                    firstName: Maya
                    lastName: Okafor
                    displayName: Maya Okafor
                    trackingGoal: CYCLE_TRACKING
                    onboardingStatus: COMPLETED
                meta:
                  requestId: req_1729339200000
        '401':
          description: Missing, expired, or invalid access token.
      security:
        - accessToken: []
      summary: Get the authenticated account
      tags:
        - Authentication
  /auth/sessions:
    get:
      description: Returns the current user’s sessions newest first. Refresh-token values are never returned.
      operationId: AuthController_getSessions
      parameters: []
      responses:
        '200':
          description: Session metadata.
      security:
        - accessToken: []
      summary: List the authenticated account’s sessions
      tags:
        - Authentication
  /auth/verify-email:
    post:
      description: Consumes the single-use, time-limited token delivered in the verification email.
      operationId: AuthController_verifyEmail
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - token
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 256
      responses:
        '200':
          description: Email verified.
        '400':
          description: Verification token is invalid or expired.
      summary: Verify an email address
      tags:
        - Authentication
  /auth/resend-verification:
    post:
      description: Requests a new verification email. The generic response does not disclose whether the account exists.
      operationId: AuthController_resendVerification
      parameters:
        - name: email
          required: true
          in: query
          description: Email address to send a verification message to.
          schema:
            example: maya@example.com
            type: string
      responses:
        '200':
          description: Generic confirmation returned to prevent account enumeration.
      summary: Resend email verification
      tags:
        - Authentication
  /auth/forgot-password:
    post:
      description: >-
        Sends password-reset instructions when an eligible account exists. The response is intentionally generic to
        prevent account enumeration.
      operationId: AuthController_forgotPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: maya@example.com
      responses:
        '200':
          description: Generic confirmation returned regardless of account existence.
      summary: Request a password reset
      tags:
        - Authentication
  /auth/reset-password:
    post:
      description: >-
        Consumes a valid password-reset token and revokes all existing sessions. Passwords require at least eight
        characters, one uppercase letter, and one number.
      operationId: AuthController_resetPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 256
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 128
                  example: NewSecurePass1
      responses:
        '200':
          description: Password updated; sign in again.
        '400':
          description: Reset token is invalid or expired.
      summary: Set a new password
      tags:
        - Authentication
  /users/me:
    get:
      description: >-
        Returns the authenticated account and profile summary. The user is derived from the access token; no user ID is
        accepted from the client.
      operationId: UsersController_getProfile
      parameters: []
      responses:
        '200':
          description: Profile returned.
        '401':
          description: Missing, expired, or invalid access token.
      security:
        - accessToken: []
      summary: Get the current user profile
      tags:
        - Users
    patch:
      description: 'Partial update: include only fields to change. Dates use YYYY-MM-DD. Unknown fields are rejected.'
      operationId: UsersController_updateProfile
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                firstName:
                  type: string
                  maxLength: 80
                lastName:
                  type: string
                  maxLength: 80
                displayName:
                  type: string
                  maxLength: 120
                dateOfBirth:
                  type: string
                  format: date
                phoneNumber:
                  type: string
                  maxLength: 32
                countryCode:
                  type: string
                  enum:
                    - NG
                    - GH
                    - GB
                    - US
                timeZone:
                  type: string
                  maxLength: 64
                  example: Africa/Lagos
                trackingGoal:
                  type: string
                  enum:
                    - CYCLE_TRACKING
                    - PREGNANCY
                    - FERTILITY
                    - GENERAL_WELLNESS
                preferredLanguage:
                  type: string
                  minLength: 2
                  maxLength: 8
      responses:
        '200':
          description: Profile updated.
        '401':
          description: Missing, expired, or invalid access token.
      security:
        - accessToken: []
      summary: Update the current user profile
      tags:
        - Users
  /users/onboarding:
    get:
      description: >-
        Returns the authenticated user’s resumable onboarding state. A user identifier is never accepted from the
        client.
      operationId: UsersController_getOnboarding
      parameters: []
      responses:
        '200':
          description: Onboarding draft or an empty first-step draft.
      security:
        - accessToken: []
      summary: Get the current user’s onboarding draft
      tags:
        - Users
    patch:
      description: >-
        Partially updates the current user’s onboarding draft. Canonical steps are numbered 1 through 8; the draft can
        be resumed or rewound.
      operationId: UsersController_updateOnboarding
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                step:
                  type: integer
                  minimum: 1
                  maximum: 8
                objective:
                  type: string
                  enum:
                    - CYCLE_TRACKING
                    - PREGNANCY
                    - FERTILITY
                    - GENERAL_WELLNESS
                lastMenstrualPeriod:
                  type: string
                  format: date
                cycleLengthDays:
                  type: integer
                  minimum: 20
                  maximum: 45
                bleedingDays:
                  type: integer
                  minimum: 1
                  maximum: 15
                conditions:
                  type: array
                  maxItems: 30
                  items:
                    type: string
                    maxLength: 80
                concerns:
                  type: array
                  maxItems: 30
                  items:
                    type: string
                    maxLength: 120
                notificationsEnabled:
                  type: boolean
      responses:
        '200':
          description: Onboarding draft saved.
      security:
        - accessToken: []
      summary: Save onboarding progress
      tags:
        - Users
  /users/onboarding/complete:
    post:
      description: >-
        Completes the user’s onboarding after all eight steps and the required objective have been saved. The server
        sets onboardingStatus; it is not client-editable.
      operationId: UsersController_completeOnboarding
      parameters: []
      responses:
        '201':
          description: Onboarding completed and profile preferences committed.
        '422':
          description: Onboarding draft is incomplete or already in an invalid state.
      security:
        - accessToken: []
      summary: Complete onboarding
      tags:
        - Users
  /users/me/privacy-jobs:
    get:
      description: >-
        Lists only privacy jobs belonging to the authenticated account. Deletion job execution is operator-managed and
        is not proof of completed erasure.
      operationId: UsersController_getPrivacyJobs
      parameters: []
      responses:
        '200':
          description: Owner-scoped privacy job records.
      security:
        - accessToken: []
      summary: List personal-data export and deletion requests
      tags:
        - Users
  /users/me/export:
    get:
      description: Returns the authenticated user’s available account and profile data in a portable JSON representation.
      operationId: UsersController_exportData
      parameters: []
      responses:
        '200':
          description: Personal data export.
      security:
        - accessToken: []
      summary: Export the current user’s personal data
      tags:
        - Users
  /users/me/request-deletion:
    post:
      description: >-
        Schedules account deletion after a 30-day grace period. This is a consequential account action; the user can
        cancel it during the grace period.
      operationId: UsersController_requestDeletion
      parameters: []
      responses:
        '201':
          description: Deletion request accepted with the scheduled deletion date.
      security:
        - accessToken: []
      summary: Request account deletion
      tags:
        - Users
  /users/me/cancel-deletion:
    post:
      description: Restores the current account to active status and clears its pending deletion request.
      operationId: UsersController_cancelDeletion
      parameters: []
      responses:
        '201':
          description: Pending deletion cancelled.
      security:
        - accessToken: []
      summary: Cancel a pending account deletion
      tags:
        - Users
  /config/options:
    get:
      description: >-
        Returns versioned UI option values. Condition and consultation choices are provisional and must be confirmed by
        product/clinical review.
      operationId: ConfigController_getOptions
      parameters: []
      responses:
        '200':
          description: Versioned mobile configuration option catalog.
      summary: Get mobile enum and localization options
      tags:
        - Configuration
  /consents:
    get:
      description: >-
        Returns the latest recorded choice per purpose plus the append-only grant/revocation event history for the
        authenticated user.
      operationId: ConsentController_getConsents
      parameters: []
      responses:
        '200':
          description: Consent history; no records means no consent has been recorded.
      security:
        - accessToken: []
      summary: Get consent status and immutable history
      tags:
        - Consents
    post:
      description: >-
        Appends a grant or revocation event. Previous consent evidence is never overwritten. A recorded grant is not
        legal advice or proof that a purpose is lawful.
      operationId: ConsentController_recordConsent
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - purpose
                - policyVersion
                - granted
                - source
              properties:
                purpose:
                  type: string
                  enum:
                    - terms_of_service_acknowledgement
                    - privacy_notice_acknowledgement
                    - health_data_processing
                    - care_communications
                    - health_sharing
                    - location_sharing
                    - marketing
                policyVersion:
                  type: string
                  minLength: 1
                  maxLength: 40
                granted:
                  type: boolean
                source:
                  type: string
                  enum:
                    - onboarding
                    - settings
                    - feature_action
      responses:
        '201':
          description: Consent event appended.
        '400':
          description: Invalid consent purpose, source, policy version, or decision.
      security:
        - accessToken: []
      summary: Record a purpose-specific consent decision
      tags:
        - Consents
  /cycles/current:
    get:
      description: 'Returns the current active cycle or `data: null` when no period has been logged. Dates use YYYY-MM-DD.'
      operationId: CyclesController_getCurrentCycle
      parameters: []
      responses:
        '200':
          description: Current cycle or null when none is active.
      security:
        - accessToken: []
      summary: Get the active menstrual cycle
      tags:
        - Cycles
  /cycles/history:
    get:
      description: >-
        Returns this user’s recorded cycles, average observed cycle interval, data sufficiency, and a cursor for the
        next page. Not a contraceptive method.
      operationId: CyclesController_getCycleHistory
      parameters: []
      responses:
        '200':
          description: Cycle history and summary.
      security:
        - accessToken: []
      summary: List cycle history
      tags:
        - Cycles
  /cycles/history/{id}:
    get:
      description: Returns the authenticated user’s cycle with associated daily logs and recorded flow pattern.
      operationId: CyclesController_getCycleHistoryDetail
      parameters:
        - name: id
          required: true
          in: path
          description: 24-character cycle identifier.
          schema:
            type: string
      responses:
        '200':
          description: Cycle detail and flow pattern.
        '404':
          description: Cycle not found for this account.
      security:
        - accessToken: []
      summary: Get cycle history detail
      tags:
        - Cycles
  /cycles/{id}:
    patch:
      description: >-
        Updates the authenticated user’s period start/end dates or private note. Dates are calendar dates. Periods
        cannot overlap or be reordered across adjacent records.
      operationId: CyclesController_updateCycle
      parameters:
        - name: id
          required: true
          in: path
          description: 24-character cycle identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
                  nullable: true
                notes:
                  type: string
                  maxLength: 1000
                  nullable: true
      responses:
        '200':
          description: Cycle updated.
        '400':
          description: The update creates an invalid or overlapping period.
        '404':
          description: Cycle not found for this account.
      security:
        - accessToken: []
      summary: Edit a recorded period
      tags:
        - Cycles
  /cycles/start-period:
    post:
      description: >-
        Starts a cycle for the supplied calendar date, or today when omitted. Repeating the same date is idempotent; any
        previous active cycle is completed.
      operationId: CyclesController_startPeriod
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                date:
                  type: string
                  format: date
                  description: Period start date. Defaults to today.
                  example: '2026-10-19'
      responses:
        '201':
          description: Cycle logged, with cycle prediction when available.
      security:
        - accessToken: []
      summary: Log the start of a period
      tags:
        - Cycles
  /cycles/end-period:
    post:
      description: Ends the active period on the supplied date, or today when omitted.
      operationId: CyclesController_endPeriod
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                date:
                  type: string
                  format: date
                  description: Period end date. Defaults to today.
                  example: '2026-10-23'
      responses:
        '201':
          description: Active cycle updated with period end information.
        '404':
          description: No active cycle exists.
      security:
        - accessToken: []
      summary: Log the end of a period
      tags:
        - Cycles
  /daily-logs/{date}:
    get:
      description: Returns the log for a calendar date. If no log exists, returns a default empty log for that date.
      operationId: DailyLogsController_getDailyLog
      parameters:
        - name: date
          required: true
          in: path
          description: Calendar date in YYYY-MM-DD format.
          schema:
            example: '2026-10-19'
            type: string
      responses:
        '200':
          description: Daily log or default empty log.
      security:
        - accessToken: []
      summary: Get a daily health log
      tags:
        - Daily logs
    put:
      description: >-
        Upserts the authenticated user’s log for the date. Omitted mood and symptom lists default to empty arrays;
        provide the complete desired value for each included field. The response includes a version for subsequent
        conditional edits.
      operationId: DailyLogsController_upsertDailyLog
      parameters:
        - name: date
          required: true
          in: path
          description: Calendar date in YYYY-MM-DD format.
          schema:
            example: '2026-10-19'
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                bleeding:
                  type: object
                  additionalProperties: false
                  properties:
                    level:
                      type: string
                      enum:
                        - none
                        - spotting
                        - light
                        - medium
                        - heavy
                    clots:
                      type: boolean
                pain:
                  type: object
                  additionalProperties: false
                  properties:
                    level:
                      type: integer
                      minimum: 0
                      maximum: 10
                    locations:
                      type: array
                      maxItems: 12
                      items:
                        type: string
                        maxLength: 40
                moods:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    maxLength: 40
                symptoms:
                  type: array
                  maxItems: 30
                  items:
                    type: string
                    maxLength: 40
                notes:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: Saved daily log.
      security:
        - accessToken: []
      summary: Create or replace a daily health log
      tags:
        - Daily logs
    patch:
      description: >-
        Changes only supplied fields and nested properties. Include the current version returned by GET/PUT; stale
        writes receive 409 VERSION_CONFLICT.
      operationId: DailyLogsController_patchDailyLog
      parameters:
        - name: date
          required: true
          in: path
          description: Calendar date in YYYY-MM-DD format.
          schema:
            example: '2026-10-19'
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
              additionalProperties: false
              properties:
                version:
                  type: integer
                  minimum: 1
                bleeding:
                  type: object
                  additionalProperties: false
                  properties:
                    level:
                      type: string
                      enum:
                        - none
                        - spotting
                        - light
                        - medium
                        - heavy
                    clots:
                      type: boolean
                pain:
                  type: object
                  additionalProperties: false
                  properties:
                    level:
                      type: integer
                      minimum: 0
                      maximum: 10
                    locations:
                      type: array
                      maxItems: 12
                      items:
                        type: string
                        maxLength: 40
                moods:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    maxLength: 40
                symptoms:
                  type: array
                  maxItems: 30
                  items:
                    type: string
                    maxLength: 40
                sexualActivity:
                  type: object
                  additionalProperties: false
                  properties:
                    occurred:
                      type: boolean
                    protection:
                      type: string
                      maxLength: 40
                notes:
                  type: string
                  maxLength: 2000
                  nullable: true
      responses:
        '200':
          description: Daily log updated.
        '404':
          description: Daily log not found for this account.
        '409':
          description: The supplied version is stale.
      security:
        - accessToken: []
      summary: Partially update a daily health log
      tags:
        - Daily logs
    delete:
      description: Deletes only the authenticated user’s log when the supplied version matches the current record.
      operationId: DailyLogsController_deleteDailyLog
      parameters:
        - name: date
          required: true
          in: path
          description: Calendar date in YYYY-MM-DD format.
          schema:
            example: '2026-10-19'
            type: string
      responses:
        '200':
          description: Daily log deleted.
        '404':
          description: Daily log not found for this account.
        '409':
          description: The supplied version is stale.
      security:
        - accessToken: []
      summary: Delete a daily health log
      tags:
        - Daily logs
  /pregnancies/current:
    get:
      description: >-
        Returns the current pregnancy with estimated gestational age and milestone, or `data: null` when no active
        pregnancy exists.
      operationId: PregnancyController_getCurrentPregnancy
      parameters: []
      responses:
        '200':
          description: Active pregnancy or null.
      security:
        - accessToken: []
      summary: Get the active pregnancy
      tags:
        - Pregnancy
  /pregnancies/history:
    get:
      description: Returns the authenticated user’s pregnancy records, newest first, using cursor pagination.
      operationId: PregnancyController_getPregnancyHistory
      parameters: []
      responses:
        '200':
          description: Pregnancy history and next cursor.
      security:
        - accessToken: []
      summary: List pregnancy history
      tags:
        - Pregnancy
  /pregnancies/logs/{date}:
    get:
      description: Returns the authenticated user’s saved pregnancy log or a default empty log for the date.
      operationId: PregnancyController_getPregnancyLog
      parameters:
        - name: date
          required: true
          in: path
          description: Local calendar date in YYYY-MM-DD format.
          schema:
            type: string
      responses:
        '200':
          description: Saved check-in or default empty check-in.
      security:
        - accessToken: []
      summary: Get the pregnancy check-in for a date
      tags:
        - Pregnancy
  /pregnancies:
    post:
      description: >-
        Provide either lastMenstrualPeriod or estimatedDueDate. Only one active pregnancy is allowed per account. Dates
        use YYYY-MM-DD.
      operationId: PregnancyController_createPregnancy
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                lastMenstrualPeriod:
                  type: string
                  format: date
                  example: '2026-08-01'
                estimatedDueDate:
                  type: string
                  format: date
                  example: '2027-05-08'
                calculationSource:
                  type: string
                  enum:
                    - last_menstrual_period
                    - ultrasound
                    - medical_professional
                    - user_entered
                  default: last_menstrual_period
                multiplePregnancy:
                  type: boolean
                  default: false
              description: At least one of lastMenstrualPeriod or estimatedDueDate is required.
      responses:
        '201':
          description: Pregnancy profile created.
        '400':
          description: Neither date provided, or an active pregnancy already exists.
      security:
        - accessToken: []
      summary: Create a pregnancy profile
      tags:
        - Pregnancy
  /pregnancies/{id}:
    patch:
      description: Owner-scoped update. An owner-entered due date is recorded as an estimate and is not marked clinician-confirmed.
      operationId: PregnancyController_updatePregnancy
      parameters:
        - name: id
          required: true
          in: path
          description: 24-character pregnancy identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                lastMenstrualPeriod:
                  type: string
                  format: date
                  nullable: true
                estimatedDueDate:
                  type: string
                  format: date
                calculationSource:
                  type: string
                  enum:
                    - last_menstrual_period
                    - ultrasound
                    - user_entered
                dateConfidence:
                  type: string
                  enum:
                    - certain
                    - approximate
                    - unknown
                multiplePregnancy:
                  type: boolean
      responses:
        '200':
          description: Pregnancy updated with dating provenance.
        '404':
          description: Pregnancy not found for this account.
        '409':
          description: Pregnancy is no longer active.
      security:
        - accessToken: []
      summary: Update active pregnancy dating and profile fields
      tags:
        - Pregnancy
  /pregnancies/{id}/timeline:
    get:
      description: Returns owner-scoped recorded pregnancy events and due-date estimate. No unreviewed medical advice is generated.
      operationId: PregnancyController_getTimeline
      parameters:
        - name: id
          required: true
          in: path
          description: 24-character pregnancy identifier.
          schema:
            type: string
      responses:
        '200':
          description: Pregnancy timeline.
        '404':
          description: Pregnancy not found for this account.
      security:
        - accessToken: []
      summary: Get pregnancy timeline
      tags:
        - Pregnancy
  /pregnancies/{id}/kicks:
    post:
      description: >-
        Owner-scoped. Tracking is blocked before 28 gestational weeks; this is a logging feature, not reassurance or
        medical advice.
      operationId: PregnancyController_recordKickSession
      parameters:
        - name: id
          required: true
          in: path
          description: 24-character pregnancy identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - startedAt
                - completedAt
                - count
              additionalProperties: false
              properties:
                startedAt:
                  type: string
                  format: date-time
                completedAt:
                  type: string
                  format: date-time
                count:
                  type: integer
                  minimum: 1
                  maximum: 100
      responses:
        '201':
          description: Kick-count session recorded.
        '422':
          description: Kick counting is not enabled before 28 weeks.
      security:
        - accessToken: []
      summary: Record a fetal movement count session
      tags:
        - Pregnancy
    get:
      description: Returns the authenticated user’s recorded sessions.
      operationId: PregnancyController_getKickSessions
      parameters:
        - name: id
          required: true
          in: path
          description: 24-character pregnancy identifier.
          schema:
            type: string
      responses:
        '200':
          description: Kick-count sessions.
      security:
        - accessToken: []
      summary: List fetal movement count sessions
      tags:
        - Pregnancy
  /pregnancies/{id}/wellness/{date}:
    patch:
      description: Updates only supplied water or vitamin values for a local calendar date; does not overwrite symptom fields.
      operationId: PregnancyController_updateWellness
      parameters:
        - name: id
          required: true
          in: path
          description: 24-character pregnancy identifier.
          schema:
            type: string
        - name: date
          required: true
          in: path
          description: Local calendar date in YYYY-MM-DD format.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                water:
                  type: integer
                  minimum: 0
                  maximum: 30
                vitamins:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    minLength: 1
                    maxLength: 60
      responses:
        '200':
          description: Wellness fields saved.
        '404':
          description: Active pregnancy not found for this account.
      security:
        - accessToken: []
      summary: Update pregnancy wellness counts
      tags:
        - Pregnancy
  /pregnancies/{id}/end:
    post:
      description: Records the outcome and ends the pregnancy. Valid reasons are completed, loss, terminated, or archived.
      operationId: PregnancyController_endPregnancy
      parameters:
        - name: id
          required: true
          in: path
          description: 24-character pregnancy identifier.
          schema:
            example: 66a0b6f3e5f21c8e7a112233
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - reason
              properties:
                reason:
                  type: string
                  enum:
                    - completed
                    - loss
                    - terminated
                    - archived
      responses:
        '201':
          description: Pregnancy profile ended.
        '404':
          description: Pregnancy not found for this account.
        '409':
          description: Pregnancy has already ended.
      security:
        - accessToken: []
      summary: End or archive a pregnancy profile
      tags:
        - Pregnancy
  /pregnancies/{id}/logs/{date}:
    put:
      description: >-
        Upserts the authenticated user’s structured pregnancy check-in for a local date. Free-text notes are encrypted
        at rest. Selected high-risk symptom labels return an urgent safety notice; this API is not an emergency service.
      operationId: PregnancyController_logSymptom
      parameters:
        - name: id
          required: true
          in: path
          description: 24-character pregnancy identifier.
          schema:
            example: 66a0b6f3e5f21c8e7a112233
            type: string
        - name: date
          required: true
          in: path
          description: Calendar date in YYYY-MM-DD format.
          schema:
            example: '2026-10-19'
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nausea:
                  type: string
                  enum:
                    - none
                    - mild
                    - moderate
                    - severe
                symptoms:
                  type: array
                  maxItems: 30
                  items:
                    type: string
                    minLength: 1
                    maxLength: 60
                  default: []
                mood:
                  type: string
                  maxLength: 40
                energy:
                  type: string
                  maxLength: 40
                water:
                  type: integer
                  minimum: 0
                  maximum: 30
                vitamins:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                nutrition:
                  type: array
                  maxItems: 30
                  items:
                    type: string
                selfCare:
                  type: array
                  maxItems: 30
                  items:
                    type: string
                notes:
                  type: string
                  maxLength: 2000
                  nullable: true
                fetalMovement:
                  type: string
                  enum:
                    - normal
                    - reduced
                    - absent
                    - not_assessed
                  default: not_assessed
      responses:
        '200':
          description: Pregnancy check-in saved; may include an urgent safetyNotice.
        '404':
          description: Pregnancy not found for this account.
        '503':
          description: Sensitive-note encryption is not configured.
      security:
        - accessToken: []
      summary: Log pregnancy check-in
      tags:
        - Pregnancy
  /directory/search:
    get:
      description: >-
        Searches verified directory resources by text, category, and country. Results are paginated; use countryCode=ALL
        to search across countries.
      operationId: DirectoryController_search
      parameters:
        - name: limit
          required: false
          in: query
          description: Results per page (default 20; maximum 50).
          schema:
            example: 20
            type: number
        - name: page
          required: false
          in: query
          description: 1-based page number (default 1; maximum 1000).
          schema:
            example: 1
            type: number
        - name: category
          required: false
          in: query
          description: Category filter.
          schema:
            example: Emergency
        - name: countryCode
          required: false
          in: query
          schema:
            enum:
              - NG
              - GH
              - GB
              - US
              - ALL
            type: string
        - name: q
          required: false
          in: query
          description: Search text matched against organization name, category, and service summary.
          schema:
            example: maternity hospital
      responses:
        '200':
          description: Matching directory records; pagination totals are in meta.
      summary: Search the health and emergency directory
      tags:
        - Directory
  /directory/nearby:
    get:
      description: >-
        Returns resources near WGS84 coordinates. Longitude is -180..180, latitude is -90..90, and distance is in
        meters.
      operationId: DirectoryController_getNearby
      parameters:
        - name: limit
          required: false
          in: query
          description: Maximum results, 1–50 (default 20).
          schema:
            example: 20
            type: number
        - name: maxDistanceMeters
          required: false
          in: query
          description: Search radius, 100–200000 meters (default 50000).
          schema:
            example: 25000
            type: number
        - name: lat
          required: true
          in: query
          description: Latitude in decimal degrees (WGS84).
          schema:
            example: 6.5244
            type: number
        - name: lng
          required: true
          in: query
          description: Longitude in decimal degrees (WGS84).
          schema:
            example: 3.3792
            type: number
      responses:
        '200':
          description: Nearby directory records ordered by proximity.
          content:
            application/json:
              example:
                success: true
                data:
                  - record_id: NG-LAG-001
                    organisation_name: Example Maternity Centre
                    top_category: Maternity care
                    countryCode: NG
                    city: Lagos
                    phone: +234 800 000 0000
                    service_summary: Maternity and emergency obstetric care
                    verification_status: Source verified
                meta:
                  total: 1
                  requestId: req_1729339200000
      summary: Find nearby health and emergency services
      tags:
        - Directory
  /directory/services/{serviceId}:
    get:
      description: 'Looks up a resource by its public directory record_id. A missing record is returned as data: null.'
      operationId: DirectoryController_getServiceById
      parameters:
        - name: serviceId
          required: true
          in: path
          description: Directory record identifier.
          schema:
            example: NG-LAG-001
            type: string
      responses:
        '200':
          description: Directory record or null when it does not exist.
      summary: Get a directory resource
      tags:
        - Directory
  /webhooks/twilio/whatsapp/inbound:
    post:
      description: >-
        Provider-to-server callback. Twilio signs the exact public request URL and form parameters; configure the public
        webhook URL and preserve form-encoded payloads. Not a mobile-client operation.
      operationId: NotificationsController_handleTwilioInbound
      parameters:
        - name: x-twilio-signature
          required: true
          in: header
          schema:
            type: string
        - name: X-Twilio-Signature
          in: header
          description: Twilio request signature, validated against the configured account auth token.
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Inbound provider message accepted.
        '403':
          description: Missing or invalid Twilio signature.
      summary: Twilio WhatsApp inbound webhook
      tags:
        - Notifications and webhooks
  /webhooks/twilio/whatsapp/status:
    post:
      description: >-
        Provider-to-server status callback. Configure Twilio to send MessageSid and MessageStatus form fields. Not a
        mobile-client operation.
      operationId: NotificationsController_handleTwilioStatus
      parameters:
        - name: x-twilio-signature
          required: true
          in: header
          schema:
            type: string
      responses:
        '201':
          description: Provider status accepted and mapped to the internal delivery state.
      summary: Twilio WhatsApp delivery-status webhook
      tags:
        - Notifications and webhooks
  /internal/cron/process-notifications:
    get:
      description: >-
        Internal scheduler operation that atomically claims and processes up to 20 due notifications. Supply the
        configured secret in the X-Cron-Secret header; query-string secrets are supported for compatibility but
        discouraged because URLs may be logged. Not a mobile-client operation.
      operationId: NotificationsController_processNotificationOutbox
      parameters:
        - name: cronSecret
          required: false
          in: query
          description: Legacy secret transport. Prefer X-Cron-Secret header.
          schema:
            type: string
        - name: x-cron-secret
          required: true
          in: header
          schema:
            type: string
        - name: X-Cron-Secret
          in: header
          description: Value configured by the operator as CRON_SECRET.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Processing result, including claimedCount and processedAt.
      summary: Process pending notification outbox (internal)
      tags:
        - Notifications and webhooks
  /safety/guardians:
    get:
      description: >-
        Returns only the authenticated owner’s non-revoked guardian contacts. Pending contacts are not used for SOS
        alerts.
      operationId: SafetyController_listGuardians
      parameters: []
      responses:
        '200':
          description: Owner-scoped guardian contact list.
      security:
        - accessToken: []
      summary: List trusted contacts
      tags:
        - Safety
    post:
      description: >-
        Creates an invitation record. No invitation is sent and no identity verification is claimed until an approved
        delivery and verification flow is configured.
      operationId: SafetyController_createGuardian
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - phoneE164
                - scopes
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                phoneE164:
                  type: string
                  pattern: ^\\+[1-9]\\d{7,14}$
                scopes:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items:
                    type: string
                    enum:
                      - sos_alert
                      - check_in
      responses:
        '201':
          description: Pending guardian contact; external invitation delivery is disabled.
      security:
        - accessToken: []
      summary: Add a pending trusted contact
      tags:
        - Safety
  /safety/guardians/accept:
    post:
      description: >-
        Token is single-use and hashed at rest. Acceptance does not verify the invitee’s identity; independent
        verification is still required.
      operationId: SafetyController_acceptGuardian
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              additionalProperties: false
              properties:
                token:
                  type: string
                  minLength: 32
                  maxLength: 256
      responses:
        '200':
          description: Invitation accepted pending identity verification.
      security:
        - accessToken: []
      summary: Accept a guardian invitation
      tags:
        - Safety
  /safety/guardians/{id}:
    delete:
      description: Owner-only revocation immediately removes the contact from future SOS recipient selection.
      operationId: SafetyController_revokeGuardian
      parameters:
        - name: id
          required: true
          in: path
          description: 24-character guardian contact identifier.
          schema:
            type: string
      responses:
        '200':
          description: Guardian contact revoked.
        '404':
          description: Guardian contact not found for this owner.
      security:
        - accessToken: []
      summary: Revoke a trusted contact
      tags:
        - Safety
  /safety/check-ins:
    post:
      description: Records a private, owner-scoped check-in reminder. It does not contact emergency services or guardians.
      operationId: SafetyController_createQuietCheckIn
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - checkInAt
                - expiresAt
              additionalProperties: false
              properties:
                checkInAt:
                  type: string
                  format: date-time
                expiresAt:
                  type: string
                  format: date-time
                  description: Maximum 24 hours after checkInAt.
      responses:
        '201':
          description: ''
      security:
        - accessToken: []
      summary: Create a quiet safety check-in
      tags:
        - Safety
  /safety/location-sessions:
    post:
      description: Requires current location-sharing consent; session expires within one hour and does not dispatch SOS.
      operationId: SafetyController_startLocationSession
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expiresAt
              additionalProperties: false
              properties:
                expiresAt:
                  type: string
                  format: date-time
      responses:
        '201':
          description: ''
      security:
        - accessToken: []
      summary: Start a short location-sharing session
      tags:
        - Safety
  /safety/location-sessions/{id}/updates:
    post:
      operationId: SafetyController_updateLocationSession
      parameters:
        - name: id
          required: true
          in: path
          description: 24-character location-session identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - latitude
                - longitude
                - recordedAt
              additionalProperties: false
              properties:
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                recordedAt:
                  type: string
                  format: date-time
      responses:
        '201':
          description: ''
      security:
        - accessToken: []
      tags:
        - Safety
  /safety/location-sessions/{id}:
    delete:
      operationId: SafetyController_revokeLocationSession
      parameters:
        - name: id
          required: true
          in: path
          description: 24-character location-session identifier.
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - accessToken: []
      tags:
        - Safety
  /safety/pin:
    post:
      description: >-
        Sets a 4–8 digit PIN. When a PIN already exists, currentPin is required. PINs are stored as one-way hashes and
        never returned.
      operationId: SafetyController_setSafetyPin
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - pin
              properties:
                pin:
                  type: string
                  pattern: ^\d{4,8}$
                  format: password
                  example: '4826'
                currentPin:
                  type: string
                  pattern: ^\d{4,8}$
                  format: password
                  description: Required when replacing an existing PIN.
      responses:
        '201':
          description: Safety PIN created or updated.
        '401':
          description: Current PIN is incorrect.
      security:
        - accessToken: []
      summary: Create or update the Safety PIN
      tags:
        - Safety
  /safety/pin/change:
    post:
      description: Requires the current PIN and the new 4–8 digit PIN.
      operationId: SafetyController_changeSafetyPin
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - currentPin
                - newPin
              properties:
                currentPin:
                  type: string
                  pattern: ^\d{4,8}$
                  format: password
                newPin:
                  type: string
                  pattern: ^\d{4,8}$
                  format: password
      responses:
        '201':
          description: Safety PIN changed.
        '401':
          description: Current PIN is incorrect.
      security:
        - accessToken: []
      summary: Change the Safety PIN
      tags:
        - Safety
  /safety/pin/status:
    get:
      description: Reports whether a PIN exists and whether verification is temporarily locked. Never returns the PIN or its hash.
      operationId: SafetyController_pinStatus
      parameters: []
      responses:
        '200':
          description: PIN configured and lockout status.
      security:
        - accessToken: []
      summary: Get Safety PIN status
      tags:
        - Safety
  /safety/sos/trigger:
    post:
      description: >-
        Creates an SOS incident for the authenticated user. Set isTestMode=true to simulate a drill. Records a
        user-requested incident. No guardian delivery or emergency-services dispatch is claimed; this endpoint does not
        replace local emergency services.
      operationId: SafetyController_triggerSos
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                isTestMode:
                  type: boolean
                  default: false
                  description: When true, guardian alerts are simulated.
                gps:
                  type: string
                  maxLength: 120
                  description: Optional client-supplied location string.
                notes:
                  type: string
                  maxLength: 1000
      responses:
        '201':
          description: SOS incident created or an existing active incident returned.
          content:
            application/json:
              example:
                success: true
                data:
                  incident:
                    id: 66a0b6f3e5f21c8e7a112233
                    status: active
                    isTestMode: true
                  message: SOS test drill started. Guardian alerts are simulated in test mode.
                meta:
                  requestId: req_1729339200000
      security:
        - accessToken: []
      summary: Trigger an SOS incident
      tags:
        - Safety
  /safety/sos/cancel:
    post:
      description: >-
        Requires the account Safety PIN. Incorrect PIN attempts are throttled; the active incident remains live if
        verification fails.
      operationId: SafetyController_cancelSos
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - pin
              properties:
                pin:
                  type: string
                  pattern: ^\d{4,8}$
                  format: password
      responses:
        '201':
          description: Incident cancelled after PIN verification.
        '401':
          description: Incorrect Safety PIN.
        '404':
          description: No active SOS incident exists.
        '429':
          description: PIN verification is temporarily locked after repeated failures.
      security:
        - accessToken: []
      summary: Cancel the active SOS incident
      tags:
        - Safety
  /safety/sos/{id}/deliveries:
    get:
      description: >-
        Owner-scoped delivery evidence. Attempts are only marked sent when an approved provider confirms delivery;
